name: sync-upstream-rules

# 每天从多个公开规则源拉取最新版，用 tools/aggregate.py 合并去重成两档
# （精选版 shadowrocket-doh.conf / 全量版 shadowrocket-doh-full.conf），
# 套上本仓库固定的 DNS 头（经代理的 8.8.8.8/1.1.1.1）与 Meta 钉死段，校验通过且有变化才提交。
on:
  schedule:
    - cron: "20 19 * * *"   # 每天 03:20 (Asia/Shanghai)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all sources
        run: |
          mkdir -p /tmp/src
          cd /tmp/src
          curl -fsSL --retry 3 -o sr.conf https://raw.githubusercontent.com/zhouzhouprogram/Shadowrocket-ADBlock-Rules/master/sr_cnip_ad.conf
          curl -fsSL --retry 3 -o bm7-advertising.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising.list
          curl -fsSL --retry 3 -o bm7-advertising-domain.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Advertising/Advertising_Domain.list
          curl -fsSL --retry 3 -o bm7-proxy.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Proxy/Proxy.list
          curl -fsSL --retry 3 -o bm7-china.list https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list
          curl -fsSL --retry 3 -o ls-direct.txt https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
          curl -fsSL --retry 3 -o ls-proxy.txt https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
          curl -fsSL --retry 3 -o ls-reject.txt https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
          for f in *.conf *.list *.txt; do test -s "$f"; done

      - name: Aggregate + dedup
        run: python3 tools/aggregate.py /tmp/src .

      - name: Verify outputs (fail = do not commit)
        run: |
          for f in shadowrocket-doh.conf shadowrocket-doh-full.conf; do
            grep '^dns-server' "$f" | grep -q '8.8.8.8, 1.1.1.1'
            ! grep '^dns-server' "$f" | grep -qE '114\.114|112\.124'
            grep -q '^FINAL,PROXY' "$f"
            grep -q '^DOMAIN-SUFFIX,instagram.com,PROXY' "$f"
            grep -q 'XPD6FV' "$f"
          done

      - name: Commit if changed
        run: |
          if git diff --quiet -- shadowrocket-doh.conf shadowrocket-doh-full.conf; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket-doh.conf shadowrocket-doh-full.conf
          git commit -m "chore: sync aggregated rules $(date -u +%F)"
          git push
